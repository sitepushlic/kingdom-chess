name: Godot gameplay and 3D art verification
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:
concurrency:
  group: kingdom-godot-${{ github.ref }}
  cancel-in-progress: false
jobs:
  godot:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Diagnose runner resources before Godot
        run: |
          df -h . "$HOME"
          free -h
          python3 --version
          java -version
      - name: Download Godot 4.3 editor
        run: |
          curl -fL -o godot.zip https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.3-stable_linux.x86_64
      - name: Check Python art pipeline syntax
        run: python3 -m compileall -q tools/art
      - name: Cache generated 3D art for faster Godot builds
        id: art-cache
        uses: actions/cache@v4
        with:
          path: |
            assets/characters/*.glb
            assets/equipment/*.glb
          key: kingdom-art-v3-${{ runner.os }}-${{ hashFiles('tools/art/generate_blockouts.py', 'tools/art/generate_equipment.py') }}
      - name: Verify cached 3D art count
        if: steps.art-cache.outputs.cache-hit == 'true'
        run: |
          test "$(find assets/characters -maxdepth 1 -name '*.glb' | wc -l)" -eq 72
          test "$(find assets/equipment -maxdepth 1 -name '*.glb' | wc -l)" -eq 21
      - name: Generate original GLB character blockouts
        if: steps.art-cache.outputs.cache-hit != 'true'
        run: |
          set -o pipefail
          python3 tools/art/generate_blockouts.py 2>&1 | tee art-generation.log
      - name: Generate 21 modular equipment GLBs
        if: steps.art-cache.outputs.cache-hit != 'true'
        run: python3 tools/art/generate_equipment.py
      - name: Validate all generated GLB assets
        run: |
          set -o pipefail
          python3 tools/art/validate_blockouts.py 2>&1 | tee art-validation.log
      - name: Validate real character motion curves and skinned spine tracks
        run: python3 tools/art/validate_motion.py
      - name: Verify all 288 subdivided skinned limbs
        run: python3 tools/art/test_limb_geometry.py
      - name: Verify 432 rigid armor sockets and rest-pose transforms
        run: python3 tools/art/test_rig_attachments.py
      - name: Regression-test GLB corruption detection
        run: python3 tools/art/test_validator_failures.py
      - name: Verify all 93 GLBs regenerate identically
        # Full regeneration is intentionally reserved for manual/nightly verification;
        # doing it on every APK push doubles the slow 93-model build workload.
        if: github.event_name == 'workflow_dispatch'
        run: python3 tools/art/check_reproducibility.py
      - name: Export 93-asset art complexity manifest
        run: python3 tools/art/export_art_report.py
      - name: Upload 3D art complexity manifest
        uses: actions/upload-artifact@v4
        with:
          name: kingdom-chess-art-manifest
          path: build/art_manifest.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload generated 3D art pack
        uses: actions/upload-artifact@v4
        with:
          name: kingdom-chess-93-glb-art-pack
          path: |
            assets/characters/*.glb
            assets/equipment/*.glb
          if-no-files-found: error
          retention-days: 14
      - name: Verify Godot executable and project
        run: |
          ./Godot_v4.3-stable_linux.x86_64 --headless --version
          test -f project.godot
          test -f export_presets.cfg
      - name: Import project
        run: |
          set -o pipefail
          timeout 240s ./Godot_v4.3-stable_linux.x86_64 --headless --path . --editor --quit 2>&1 | tee import.log
          if grep -Eq "SCRIPT ERROR:|ERROR: Failed to load script|Parse Error:|ERROR:.*glTF" import.log; then
            echo "Godot import reported parser or glTF errors"
            exit 1
          fi
      - name: Launch actual Godot main scene
        run: |
          set -o pipefail
          # This is a real headless game launch, separate from editor import
          # and scripted smoke tests. A deliberate timeout is expected because
          # the game remains interactive until a user exits.
          set +e
          timeout 25s ./Godot_v4.3-stable_linux.x86_64 --headless --path . 2>&1 | tee game-launch.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ] && [ "$status" -ne 124 ]; then
            echo "Godot main scene exited unexpectedly: $status"
            exit "$status"
          fi
          if grep -Eq "SCRIPT ERROR:|ERROR: Failed to load script|Parse Error:|ERROR:.*glTF|ERROR:.*Failed to load|ERROR:.*Cannot open" game-launch.log; then
            echo "Godot main scene emitted script/import errors"
            exit 1
          fi
          echo "Godot main scene launched without detected script/import errors (exit $status)."
      - name: Run gameplay smoke tests
        run: |
          set -o pipefail
          # Headless dummy rendering can emit mesh_get_surface_count(null) warnings.
          # Use the compatibility renderer for a real GL backend when supported;
          # keep assertions authoritative and preserve full diagnostics.
          timeout 240s ./Godot_v4.3-stable_linux.x86_64 --headless --rendering-method gl_compatibility --path . --script res://tests/smoke.gd 2>&1 | tee smoke.log
          if grep -Eq "TEST FAILED:|SMOKE ASSERTIONS FAILED|SCRIPT ERROR:|Parse Error:" smoke.log; then
            echo "=== Actionable Godot smoke failures ==="
            grep -En -B 3 -A 5 "TEST FAILED:|SMOKE ASSERTIONS FAILED|SCRIPT ERROR:|Parse Error:" smoke.log | tail -n 120
            exit 1
          fi
          if ! grep -q "KINGDOM CHESS: GAMEPLAY LOGIC SMOKE TESTS PASSED" smoke.log; then
            echo "=== Smoke test did not reach success marker: first 120 diagnostic lines ==="
            sed -n "1,120p" smoke.log
            echo "=== Last 100 lines ==="
            tail -n 100 smoke.log
            exit 1
          fi
          if grep -Eq "SCRIPT ERROR:|ERROR: Failed to load script|Parse Error:" smoke.log; then
            echo "Godot emitted script or parser errors; failing verification"
            exit 1
          fi
      - name: Publish Godot verification summary
        if: always()
        run: |
          {
            echo "## Kingdom Chess Godot 4.3 verification"
            echo
            echo 'APK export intentionally paused; this workflow validates Godot and 3D art only.'
            for name in art-generation.log art-validation.log import.log game-launch.log smoke.log; do
              if [ -f "$name" ]; then
                echo
                echo "### $name (last 25 lines)"
                echo '```text'
                tail -n 25 "$name"
                echo '```'
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Godot import and smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kingdom-chess-godot-diagnostics
          path: |
            art-generation.log
            art-validation.log
            import.log
            game-launch.log
            smoke.log
          if-no-files-found: ignore
