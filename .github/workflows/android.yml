name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: kingdom-android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" "platform-tools"
      - name: Download Godot and export templates
        run: |
          curl -fL -o godot.zip https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.3-stable_linux.x86_64
          curl -fL -o templates.tpz https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.3.stable"
          unzip -q templates.tpz
          cp templates/* "$HOME/.local/share/godot/export_templates/4.3.stable/"
      - name: Restore playtest signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: kingdom-chess-playtest-debug-signing-v1
      - name: Create debug signing key
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
      - name: Configure Godot Android export
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          echo "Android SDK: $ANDROID_HOME"
          echo "Java SDK: $JAVA_HOME"
          test -f "$ANDROID_HOME/platforms/android-34/android.jar"
          test -f "$HOME/.android/debug.keystore"
      - name: Set absolute debug keystore path
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          preset = Path("export_presets.cfg")
          text = preset.read_text()
          text = text.replace('keystore/debug="~/.android/debug.keystore"', 'keystore/debug="' + os.environ["HOME"] + '/.android/debug.keystore"')
          preset.write_text(text)
          PY
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey
      - name: Check Python art pipeline syntax
        run: python3 -m py_compile tools/art/generate_blockouts.py tools/art/generate_equipment.py tools/art/validate_blockouts.py tools/art/check_reproducibility.py
      - name: Generate original GLB character blockouts
        run: python3 tools/art/generate_blockouts.py
      - name: Generate 21 modular equipment GLBs
        run: python3 tools/art/generate_equipment.py
      - name: Validate all generated GLB assets
        run: python3 tools/art/validate_blockouts.py
      - name: Verify all 93 GLBs regenerate identically
        run: python3 tools/art/check_reproducibility.py
      - name: Export 93-asset art complexity manifest
        run: python3 tools/art/export_art_report.py
      - name: Upload 3D art complexity manifest
        uses: actions/upload-artifact@v4
        with:
          name: kingdom-chess-art-manifest
          path: build/art_manifest.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload generated 3D art pack
        uses: actions/upload-artifact@v4
        with:
          name: kingdom-chess-93-glb-art-pack
          path: |
            assets/characters/*.glb
            assets/equipment/*.glb
          if-no-files-found: error
          retention-days: 14
      - name: Import project
        run: |
          set -o pipefail
          ./Godot_v4.3-stable_linux.x86_64 --headless --path . --editor --quit 2>&1 | tee import.log
          if grep -Eq "SCRIPT ERROR:|ERROR: Failed to load script|Parse Error:|ERROR:.*glTF" import.log; then
            echo "Godot import reported parser or glTF errors"
            exit 1
          fi
      - name: Run gameplay smoke tests
        run: |
          set -o pipefail
          timeout 45s ./Godot_v4.3-stable_linux.x86_64 --headless --path . --script res://tests/smoke.gd --quit-after 15 2>&1 | tee smoke.log
          grep -q "KINGDOM CHESS: GAMEPLAY LOGIC SMOKE TESTS PASSED" smoke.log
          if grep -Eq "SCRIPT ERROR:|ERROR: Failed to load script|Parse Error:" smoke.log; then
            echo "Godot emitted script or parser errors; refusing APK export"
            exit 1
          fi
      - name: Export debug APK
        run: |
          mkdir -p build
          echo "=== Android toolchain ==="
          ls -la "$ANDROID_HOME/build-tools/34.0.0" | head
          echo "=== Godot export diagnostics ==="
          ./Godot_v4.3-stable_linux.x86_64 --headless --verbose --path . --export-debug Android build/kingdom-chess-debug.apk
      - name: Upload Godot import and smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kingdom-chess-godot-diagnostics
          path: |
            import.log
            smoke.log
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: kingdom-chess-android
          path: build/kingdom-chess-debug.apk
          if-no-files-found: error
