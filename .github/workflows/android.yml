name: Godot gameplay and 3D art verification
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:
concurrency:
  group: kingdom-android-${{ github.ref }}
  cancel-in-progress: false
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" "platform-tools"
      - name: Diagnose runner resources before Godot
        run: |
          df -h . "$HOME"
          free -h
          python3 --version
          java -version
      - name: Download Godot and export templates
        run: |
          curl -fL -o godot.zip https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.3-stable_linux.x86_64
          curl -fL -o templates.tpz https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.3.stable"
          unzip -q templates.tpz
          cp templates/* "$HOME/.local/share/godot/export_templates/4.3.stable/"
      - name: Restore playtest signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: kingdom-chess-playtest-debug-signing-v1
      - name: Create debug signing key
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
      - name: Configure Godot Android export
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          echo "Android SDK: $ANDROID_HOME"
          echo "Java SDK: $JAVA_HOME"
          test -f "$ANDROID_HOME/platforms/android-34/android.jar"
          test -f "$HOME/.android/debug.keystore"
      - name: Set absolute debug keystore path
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          preset = Path("export_presets.cfg")
          text = preset.read_text()
          text = text.replace('keystore/debug="~/.android/debug.keystore"', 'keystore/debug="' + os.environ["HOME"] + '/.android/debug.keystore"')
          preset.write_text(text)
          PY
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey
      - name: Check Python art pipeline syntax
        run: python3 -m compileall -q tools/art
      - name: Cache generated 3D art for faster Godot builds
        id: art-cache
        uses: actions/cache@v4
        with:
          path: |
            assets/characters/*.glb
            assets/equipment/*.glb
          key: kingdom-art-v3-${{ runner.os }}-${{ hashFiles('tools/art/generate_blockouts.py', 'tools/art/generate_equipment.py') }}
      - name: Verify cached 3D art count
        if: steps.art-cache.outputs.cache-hit == 'true'
        run: |
          test "$(find assets/characters -maxdepth 1 -name '*.glb' | wc -l)" -eq 72
          test "$(find assets/equipment -maxdepth 1 -name '*.glb' | wc -l)" -eq 21
      - name: Generate original GLB character blockouts
        if: steps.art-cache.outputs.cache-hit != 'true'
        run: |
          set -o pipefail
          python3 tools/art/generate_blockouts.py 2>&1 | tee art-generation.log
      - name: Generate 21 modular equipment GLBs
        if: steps.art-cache.outputs.cache-hit != 'true'
        run: python3 tools/art/generate_equipment.py
      - name: Validate all generated GLB assets
        run: |
          set -o pipefail
          python3 tools/art/validate_blockouts.py 2>&1 | tee art-validation.log
      - name: Validate real character motion curves and skinned spine tracks
        run: python3 tools/art/validate_motion.py
      - name: Verify all 288 subdivided skinned limbs
        run: python3 tools/art/test_limb_geometry.py
      - name: Verify 432 rigid armor sockets and rest-pose transforms
        run: python3 tools/art/test_rig_attachments.py
      - name: Regression-test GLB corruption detection
        run: python3 tools/art/test_validator_failures.py
      - name: Verify all 93 GLBs regenerate identically
        # Full regeneration is intentionally reserved for manual/nightly verification;
        # doing it on every APK push doubles the slow 93-model build workload.
        if: github.event_name == 'workflow_dispatch'
        run: python3 tools/art/check_reproducibility.py
      - name: Export 93-asset art complexity manifest
        run: python3 tools/art/export_art_report.py
      - name: Upload 3D art complexity manifest
        uses: actions/upload-artifact@v4
        with:
          name: kingdom-chess-art-manifest
          path: build/art_manifest.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload generated 3D art pack
        uses: actions/upload-artifact@v4
        with:
          name: kingdom-chess-93-glb-art-pack
          path: |
            assets/characters/*.glb
            assets/equipment/*.glb
          if-no-files-found: error
          retention-days: 14
      - name: Verify Godot executable and templates
        run: |
          ./Godot_v4.3-stable_linux.x86_64 --headless --version
          test -s "$HOME/.local/share/godot/export_templates/4.3.stable/android_debug.apk"
          test -s "$HOME/.local/share/godot/export_templates/4.3.stable/android_release.apk"
          test -f project.godot
          test -f export_presets.cfg
      - name: Import project
        run: |
          set -o pipefail
          timeout 240s ./Godot_v4.3-stable_linux.x86_64 --headless --path . --editor --quit 2>&1 | tee import.log
          if grep -Eq "SCRIPT ERROR:|ERROR: Failed to load script|Parse Error:|ERROR:.*glTF" import.log; then
            echo "Godot import reported parser or glTF errors"
            exit 1
          fi
      - name: Launch actual Godot main scene
        run: |
          set -o pipefail
          # This is a real headless game launch, separate from editor import
          # and scripted smoke tests. A deliberate timeout is expected because
          # the game remains interactive until a user exits.
          set +e
          timeout 25s ./Godot_v4.3-stable_linux.x86_64 --headless --path . 2>&1 | tee game-launch.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ] && [ "$status" -ne 124 ]; then
            echo "Godot main scene exited unexpectedly: $status"
            exit "$status"
          fi
          if grep -Eq "SCRIPT ERROR:|ERROR: Failed to load script|Parse Error:|ERROR:.*glTF|ERROR:.*Failed to load|ERROR:.*Cannot open" game-launch.log; then
            echo "Godot main scene emitted script/import errors"
            exit 1
          fi
          echo "Godot main scene launched without detected script/import errors (exit $status)."
      - name: Run gameplay smoke tests
        run: |
          set -o pipefail
          # Headless dummy rendering can emit mesh_get_surface_count(null) warnings.
          # Use the compatibility renderer for a real GL backend when supported;
          # keep assertions authoritative and preserve full diagnostics.
          timeout 240s ./Godot_v4.3-stable_linux.x86_64 --headless --rendering-method gl_compatibility --path . --script res://tests/smoke.gd 2>&1 | tee smoke.log
          if grep -Eq "TEST FAILED:|SMOKE ASSERTIONS FAILED|SCRIPT ERROR:|Parse Error:" smoke.log; then
            echo "=== Actionable Godot smoke failures ==="
            grep -En -B 3 -A 5 "TEST FAILED:|SMOKE ASSERTIONS FAILED|SCRIPT ERROR:|Parse Error:" smoke.log | tail -n 120
            exit 1
          fi
          grep -q "KINGDOM CHESS: GAMEPLAY LOGIC SMOKE TESTS PASSED" smoke.log
          if grep -Eq "SCRIPT ERROR:|ERROR: Failed to load script|Parse Error:" smoke.log; then
            echo "Godot emitted script or parser errors; refusing APK export"
            exit 1
          fi
      - name: Export debug APK
        if: false # APK intentionally paused at user request; only Godot and graphics tests run
        run: |
          set -o pipefail
          mkdir -p build
          echo "=== Android toolchain ==="
          ls -la "$ANDROID_HOME/build-tools/34.0.0" | head
          echo "=== Godot export diagnostics ==="
          timeout 300s ./Godot_v4.3-stable_linux.x86_64 --headless --verbose --path . --export-debug Android build/kingdom-chess-debug.apk 2>&1 | tee export.log
          test -s build/kingdom-chess-debug.apk
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, BadZipFile
          apk=Path("build/kingdom-chess-debug.apk")
          with ZipFile(apk) as z:
              names=set(z.namelist())
              assert "AndroidManifest.xml" in names, "APK missing AndroidManifest.xml"
              assert any(name.startswith("lib/") and name.endswith(".so") for name in names), "APK missing native Godot libraries"
              assert any(name.endswith(".pck") for name in names) or any(name.startswith("assets/") for name in names), "APK missing packaged game assets"
              broken=z.testzip()
              assert broken is None, f"Corrupted APK ZIP entry: {broken}"
          print(f"Verified APK archive: {apk.stat().st_size:,} bytes, {len(names)} entries")
          PY
      - name: Publish Android build verification summary
        if: always()
        run: |
          {
            echo "## Kingdom Chess Android build"
            echo
            if [ -s build/kingdom-chess-debug.apk ]; then
              echo "APK file exists: $(stat -c '%s' build/kingdom-chess-debug.apk) bytes."
            else
              echo "No completed APK found. Check Godot import, smoke and export logs."
            fi
            for name in art-generation.log art-validation.log import.log game-launch.log smoke.log export.log; do
              if [ -f "$name" ]; then
                echo
                echo "### $name (last 25 lines)"
                echo '```text'
                tail -n 25 "$name"
                echo '```'
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Godot import and smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kingdom-chess-godot-diagnostics
          path: |
            art-generation.log
            art-validation.log
            import.log
            game-launch.log
            smoke.log
            export.log
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: false # APK intentionally paused
        with:
          name: kingdom-chess-android
          path: build/kingdom-chess-debug.apk
          if-no-files-found: error
