name: Validate 3D Art (fast)
on:
  push:
    branches: [main]
    paths:
      - 'tools/art/**'
      - 'assets/**'
      - '.github/workflows/art-validation.yml'
  pull_request:
    paths:
      - 'tools/art/**'
      - 'assets/**'
      - '.github/workflows/art-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Compile all art scripts
        run: python3 -m compileall -q tools/art
      - name: Generate 72 character GLBs
        run: python3 tools/art/generate_blockouts.py
      - name: Generate 21 equipment GLBs
        run: python3 tools/art/generate_equipment.py
      - name: Validate all GLB structures and six skins
        run: python3 tools/art/validate_blockouts.py
      - name: Validate animated joints and recovery
        run: python3 tools/art/validate_motion.py
      - name: Verify all 288 subdivided skinned limbs
        run: python3 tools/art/test_limb_geometry.py
      - name: Verify validator rejects intentionally corrupt GLBs
        run: python3 tools/art/test_validator_failures.py
      - name: Verify deterministic generation
        run: python3 tools/art/check_reproducibility.py
      - name: Export art QA report
        run: python3 tools/art/export_art_report.py
      - name: Publish art QA summary
        run: |
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          data=json.loads(Path("build/art_manifest.json").read_text())
          print("Manifest keys:", sorted(data.keys()))
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as out:
              out.write("## Kingdom Chess: generated 3D art QA\n\n")
              out.write("93 generated GLB assets validated (72 characters, 21 equipment).\n\n")
              for key in ("total_triangles","total_skins","total_bone_references","total_animation_channels"):
                  if key in data:
                      out.write(f"- {key}: {data[key]}\n")
          PY
      - name: Upload generated art QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kingdom-chess-fast-art-qa
          path: build/art_manifest.json
          if-no-files-found: ignore
          retention-days: 14
